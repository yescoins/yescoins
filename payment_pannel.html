<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Payment Panel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#050505;
color:#fff;
font-family:Arial,sans-serif;
min-height:100vh;
padding-bottom:30px
}

.top{
height:70px;
display:flex;
align-items:center;
padding:0 18px
}

.back{
width:44px;
height:44px;
border:1px solid aqua;
border-radius:13px;
background:#111;
color:aqua;
font-size:18px;
box-shadow:0 0 12px #00ffff44;
cursor:pointer
}

.count{
margin-left:auto;
background:#111;
border:1px solid #00ffff55;
border-radius:13px;
padding:10px 14px;
font-size:14px;
box-shadow:0 0 12px #00ffff22
}

.count i{
color:#00ffff;
margin-right:5px
}

.header{
text-align:center;
margin-top:10px
}

.header h1{
margin:0;
color:aqua;
font-size:27px;
text-shadow:0 0 13px #00ffff88
}

.header p{
margin:8px 0 0;
color:#888;
font-size:14px
}

.list{
width:92%;
max-width:520px;
margin:28px auto 0;
display:flex;
flex-direction:column;
gap:16px
}

.empty{
text-align:center;
color:#666;
margin-top:60px;
font-size:14px
}

.card{
background:#101010;
border:1px solid #00ffff55;
border-radius:19px;
padding:18px;
box-shadow:0 0 15px #00ffff18
}

.row{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:10px
}

.username{
color:aqua;
font-weight:bold;
font-size:16px;
text-shadow:0 0 8px #00ffff55
}

.time{
color:#666;
font-size:12px
}

.amount{
color:#fff;
font-size:22px;
font-weight:bold;
margin:8px 0
}

.field-label{
color:#666;
font-size:12px;
margin-top:10px
}

.field-box{
display:flex;
align-items:center;
gap:8px;
background:#080808;
border:1px solid #00ffff33;
border-radius:12px;
padding:10px 12px;
margin-top:6px
}

.field-box span{
flex:1;
font-size:14px;
color:#fff;
word-break:break-all
}

.copy-btn{
background:none;
border:0;
color:aqua;
font-size:16px;
cursor:pointer;
padding:4px
}

.pay-btn{
width:100%;
height:42px;
border:0;
border-radius:12px;
background:#00ffff;
color:#000;
font-weight:bold;
cursor:pointer;
font-size:14px;
box-shadow:0 0 12px #00ffff55;
margin-top:16px
}

.pay-btn:disabled{
opacity:.4;
cursor:not-allowed;
box-shadow:none
}

#message{
position:fixed;
left:50%;
bottom:25px;
transform:translateX(-50%) translateY(100px);
background:#111;
border:1px solid aqua;
color:#fff;
padding:13px 20px;
border-radius:14px;
font-size:14px;
opacity:0;
transition:.3s;
z-index:20;
white-space:nowrap;
box-shadow:0 0 15px #00ffff55
}

#message.show{
transform:translateX(-50%) translateY(0);
opacity:1
}
</style>
</head>

<body>

<div class="top">

<button class="back" onclick="location.href='home.html'">
<i class="fa-solid fa-arrow-left"></i>
</button>

<div class="count">
<i class="fa-solid fa-clock"></i>
<span id="pendingCount">0</span>
</div>

</div>

<div class="header">
<h1>Payment Panel</h1>
<p>Pending withdrawal requests</p>
</div>

<div class="list" id="list"></div>

<div id="message"></div>


<script type="module">

import{database}from"./scripts/config.js";

import{
ref,
onValue,
get,
set,
update
}from"https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";


/* =========================
مرجع كل الطلبات
========================= */

const requestsRef=
ref(database,"requests");


/* =========================
الاستماع لكل الطلبات
========================= */

onValue(requestsRef,snapshot=>{

const data=
snapshot.val();

renderList(data);

});


/* =========================
عرض القائمة
========================= */

function renderList(data){

const list=
document.getElementById("list");

list.innerHTML="";

const pending=[];

if(data){

Object.keys(data).forEach(username=>{

const userRequests=
data[username];

Object.keys(userRequests).forEach(requestCode=>{

const request=
userRequests[requestCode];

if(request.status==="pending"){

pending.push({
username:username,
requestCode:requestCode,
amount:request.amount,
rip:request.rip,
time:request.time
});

}

});

});

}


document.getElementById("pendingCount")
.textContent=pending.length;


if(pending.length===0){

list.innerHTML=
"<div class='empty'>No pending requests.</div>";

return;

}


pending.sort((a,b)=>{

return parseTime(a.time)-parseTime(b.time);

});


pending.forEach(request=>{

const card=
document.createElement("div");

card.className="card";

card.innerHTML=`

<div class="row">
<div class="username">
<i class="fa-solid fa-user"></i>
${request.username}
</div>
<div class="time">${request.time}</div>
</div>

<div class="amount">${request.amount} DA</div>

<div class="field-label">RIP</div>
<div class="field-box">
<span>${request.rip}</span>
<button class="copy-btn" data-copy="${request.rip}">
<i class="fa-regular fa-copy"></i>
</button>
</div>

<button
class="pay-btn"
data-username="${request.username}"
data-code="${request.requestCode}"
data-amount="${request.amount}">
<i class="fa-solid fa-check"></i>
Pay
</button>

`;

list.appendChild(card);

});


document
.querySelectorAll(".copy-btn")
.forEach(button=>{

button.addEventListener("click",()=>{

copyText(button.dataset.copy);

});

});


document
.querySelectorAll(".pay-btn")
.forEach(button=>{

button.addEventListener("click",()=>{

markAsPaid(
button.dataset.username,
button.dataset.code,
Number(button.dataset.amount),
button
);

});

});

}


/* =========================
تحويل الوقت المخزّن إلى تاريخ للترتيب
========================= */

function parseTime(timeString){

const parts=
timeString.split(" - ");

const timePart=
parts[0]||"00:00:00";

const datePart=
parts[1]||"01/01/1970";

const[hours,minutes,seconds]=
timePart.split(":").map(Number);

const[day,month,year]=
datePart.split("/").map(Number);

return new Date(
year,month-1,day,
hours,minutes,seconds
).getTime();

}


/* =========================
نسخ النص
========================= */

function copyText(text){

navigator.clipboard.writeText(text)
.then(()=>{
showMessage("Copied!");
})
.catch(()=>{
showMessage("Could not copy.");
});

}


/* =========================
توليد كود رسالة فريد
========================= */

function generateCode(){

const chars=
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

let code="";

for(let i=0;i<10;i++){
code+=chars[Math.floor(Math.random()*chars.length)];
}

return code;

}

async function createUniqueMessageCode(username){

for(let i=0;i<50;i++){

const code=generateCode();

const codeRef=
ref(database,"users/"+username+"/notification/"+code);

const snapshot=
await get(codeRef);

if(!snapshot.exists()){
return code;
}

}

throw new Error("Could not create a unique message code.");

}


/* =========================
تأكيد الدفع
========================= */

async function markAsPaid(username,requestCode,amount,button){

button.disabled=true;

try{

const requestRef=
ref(database,"requests/"+username+"/"+requestCode);

await update(requestRef,{
status:"تم"
});

const messageCode=
await createUniqueMessageCode(username);

const notificationRef=
ref(database,"users/"+username+"/notification/"+messageCode);

await set(notificationRef,{
date:Date.now(),
text:"Your payment "+amount+" is successful"
});

showMessage("Marked as paid!");

}catch(error){

console.error(error);

button.disabled=false;

showMessage("Something went wrong, try again.");

}

}


/* =========================
رسالة
========================= */

function showMessage(text){

const box=
document.getElementById("message");

box.textContent=text;

box.classList.add("show");

setTimeout(()=>{
box.classList.remove("show");
},2500);

}

</script>

</body>
</html>
