<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحديث الإصدار</title>
</head>
<body>

<input id="num" type="text" placeholder="أدخل رقم الإصدار">
<button onclick="save()">حفظ</button>

<p id="msg"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDv25RohGhKcxDlt1DZaPb7BUg7LpWnJqo",
  authDomain: "yes-coins-6a2d2.firebaseapp.com",
  databaseURL: "https://yes-coins-6a2d2-default-rtdb.firebaseio.com",
  projectId: "yes-coins-6a2d2",
  storageBucket: "yes-coins-6a2d2.firebasestorage.app",
  messagingSenderId: "868288595143",
  appId: "1:868288595143:web:cc8e500e6c3c8cc4ab2ae2"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.save = async function() {
  const num = document.getElementById("num").value.trim();
  const msg = document.getElementById("msg");

  if (!num) {
    msg.textContent = "أدخل الرقم أولاً";
    return;
  }

  try {
    await set(ref(db, "app_config/latest_version"), num);
    msg.textContent = "تم الحفظ بنجاح ✅";
  } catch (error) {
    msg.textContent = "حدث خطأ: " + error.message;
  }
};
</script>

</body>
</html>
