<!DOCTYPE html>
<html lang="en" translate="no" dir="ltr">
<head>
  

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  body {
    
    
    background-size: cover;
    background-position: center;
    font-family: Arial, sans-serif;
    background-color: black;
    color: aqua;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0px;
    margin: 0;
  }
  #logo-img{
    width: 280px;
  }
  h2 {
    margin-bottom: 20px;
  }

  .password-box {
    position: relative;
  }

  .toggle-eye {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: aqua;
  }

  input {
    background: #222;
    color: aqua;
    border: 0px solid aqua;
    padding: 2px 40px 2px 10px;
    margin: 10px;
    width: 260px;
    height: 35px;
    border-radius: 12px;
    font-size: 18px;          
    outline-color: aqua;       
    font-weight: bold;                
  }

  input::placeholder {
    color: #aaa;
  }

  button {
    background-color: #222;
    color: aqua;
    border: none;
    width: 200px;
    height: 40px;
    border: 0px aqua solid;   
    margin-top: 10px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
  }

  button:hover {
    background-color: #00cccc;
  }

  a {
    color: aqua;
    margin-top: 5px;
  }


/* ----------------------------- */
/* حركة العين التي طلبتها */
/* ----------------------------- */
@keyframes eyeMove {
  0% { transform: translateY(-50%) scale(1); }
  25% { transform: translateY(-50%) scale(1.2); }
  50% { transform: translateY(-50%) scale(0.9); }
  75% { transform: translateY(-50%) scale(1.15); }
  100% { transform: translateY(-50%) scale(1); }
}

.eye-animate {
  animation: eyeMove 0.3s ease;
}

</style>
    <link rel="stylesheet" href="styles/custom_alerts.css">
  

</head>
<body bgcolor="black">

  <img id="logo-img" src="images/logo.png">

<input type="text" id="username" placeholder="Username"><br>

<div class="password-box">
  <input type="password" id="password" placeholder="Password">
  <i class="fa-solid fa-eye toggle-eye" id="togglePassword"></i>
</div>

<button id="login"><b>Login</b></button>
<a href="register.html">create new account </a>
<div id="monetag-ad">
  
<script>

const CURRENT_VERSION = 0;

// رابط Firebase مباشر (مهم: .json في النهاية)
const URL = "https://yes-coins-6a2d2-default-rtdb.firebaseio.com/app_config.json";

async function checkVersion() {

    try {
        const res = await fetch(URL + "?t=" + Date.now());
        const data = await res.json();

        const latest = data.latest_version;
        const updateUrl = data.update_url;

        // مقارنة بسيطة
        if (CURRENT_VERSION < latest) {

            document.documentElement.innerHTML = `
          <body bgcolor="black">
<div style="
                    background:black;
                    color:white;
                    height:90vh;
                    display:flex;
                    justify-content:center;
                    align-items:center;
                    flex-direction:column;
                    font-family:Arial;
                ">
    
    <img style="
        width:200px;
        
        "src="assets/mise_ajour.jpg">
                    <h2 style="color:red;"><b>Update required</b></h2>
                    <p style="text-align:center;">The application must be updated <br>to continue</p>

                    <button onclick="window.location.href=\'${updateUrl}\'"
                        style="padding:12px 78px;background:aqua;border:2px solid #333;border-radius:40px;color:black;">
                      <b>Update now</b>
                    </button>
                </div>
            `;

            return true; // Indicate that an update is required
        }
        return false; // Indicate no update is required

    } catch (e) {
        console.error("Error checking version:", e); // Log the error for debugging
        return false; // Allow the app to continue if version check fails
    }
}

</script>

<script type="module">

import { database } from "./scripts/config.js";
import { ref, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

async function initializeApp() {
    const updateRequired = await checkVersion();
    if (updateRequired) {
        return; // Stop further execution if an update is required
    }

    // -----------------------------------
    // إظهار و إخفاء كلمة المرور + حركة العين
    // -----------------------------------
    document.getElementById("togglePassword").addEventListener("click", () => {
        const pass = document.getElementById("password");
        const icon = document.getElementById("togglePassword");

        /* تشغيل الأنيميشن */
        icon.classList.add("eye-animate");

        /* إزالة الأنيميشن لتعمل كل مرة */
        setTimeout(() => {
            icon.classList.remove("eye-animate");
        }, 300);

        if (pass.type === "password") {
            pass.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            pass.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    });

    // -----------------------------------

    if (localStorage.getItem("username")) {
        window.location.href = "home.html";
    }

    document.getElementById("login").addEventListener("click", async () => {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        if (!username || !password) {
            alert("Please enter both username and password.");
            return;
        }

        
        const userRef = ref(database, "users/" + username);
        const snapshot = await get(userRef);

        if (snapshot.exists()) {
            const data = snapshot.val();
            if (data.password === password) {
                localStorage.setItem("username",username);
                localStorage.setItem("password",password);
                location.href = "home.html";
            } else {
                alert("Incorrect password.");
            }
        } else {
            alert("User does not exist.");
        }
    });
}

initializeApp();

</script>


    <script src="scripts/custom_alerts.js"></script>
</body>
</html>
