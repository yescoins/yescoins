<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Apple Tree</title>
<style>
  :root{
    --bg:#050b0e;
    --bg2:#081218;
    --aqua:#00e5ff;
    --aquamarine:#7fffd4;
    --text:#dff9ff;
    --text-dim:#7fa9b3;
    --panel:rgba(0,229,255,0.06);
    --panel-border:rgba(0,229,255,0.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; height:100%;
    background:
      radial-gradient(circle at 50% 15%, rgba(0,229,255,0.10), transparent 55%),
      radial-gradient(circle at 20% 80%, rgba(127,255,212,0.07), transparent 50%),
      var(--bg);
    color:var(--text);
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    overflow:hidden;
    user-select:none;
  }
  #app{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:18px 16px 26px;
  }

  /* Top bar: stats */
  .stats{
    width:100%;
    max-width:420px;
    display:flex;
    gap:10px;
  }
  .stat{
    flex:1;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:14px;
    padding:10px 14px;
    text-align:center;
    backdrop-filter:blur(6px);
  }
  .stat .label{
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:.3px;
  }
  .stat .value{
    font-size:20px;
    font-weight:700;
    color:var(--aquamarine);
    text-shadow:0 0 10px rgba(127,255,212,0.5);
    margin-top:2px;
  }
  .stat.level .value{ color:var(--aqua); text-shadow:0 0 10px rgba(0,229,255,0.5); }

  /* Tree area */
  .tree-zone{
    position:relative;
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
  }
  #tree{
    font-size:min(38vw, 190px);
    line-height:1;
    cursor:pointer;
    filter:drop-shadow(0 0 18px rgba(0,229,255,0.35)) drop-shadow(0 0 40px rgba(127,255,212,0.15));
    transition:transform .08s ease;
    will-change:transform;
    touch-action:manipulation;
  }
  #tree:active{ transform:scale(0.92) rotate(-2deg); }

  .floater{
    position:absolute;
    font-size:26px;
    pointer-events:none;
    animation:floatUp .9s ease-out forwards;
    color:var(--aquamarine);
    text-shadow:0 0 8px rgba(127,255,212,0.7);
    font-weight:700;
  }
  @keyframes floatUp{
    0%{ opacity:1; transform:translateY(0) scale(1); }
    100%{ opacity:0; transform:translateY(-90px) scale(1.3); }
  }

  .coin-floater{
    position:absolute;
    font-size:20px;
    pointer-events:none;
    animation:coinUp 1.1s ease-out forwards;
    color:#ffd76a;
    text-shadow:0 0 10px rgba(255,215,106,0.7);
    font-weight:800;
    left:50%;
    top:8%;
    transform:translateX(-50%);
  }
  @keyframes coinUp{
    0%{ opacity:1; transform:translate(-50%,0) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-40px) scale(1.2); }
  }

  /* Upgrade panel */
  .upgrade-wrap{
    width:100%;
    max-width:420px;
  }
  #upgradeBtn{
    width:100%;
    border:1px solid var(--panel-border);
    background:linear-gradient(180deg, rgba(0,229,255,0.14), rgba(0,229,255,0.04));
    color:var(--text);
    border-radius:16px;
    padding:14px 18px;
    font-size:16px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    box-shadow:0 0 20px rgba(0,229,255,0.12);
    transition:transform .1s ease, box-shadow .2s ease, opacity .2s ease;
  }
  #upgradeBtn:active:not(:disabled){ transform:scale(0.98); }
  #upgradeBtn:disabled{
    opacity:.45;
    cursor:not-allowed;
    box-shadow:none;
  }
  #upgradeBtn .title{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; }
  #upgradeBtn .title small{ font-weight:400; color:var(--text-dim); font-size:11px; }
  #upgradeBtn .cost{
    color:var(--aqua);
    font-size:16px;
    font-weight:800;
    text-shadow:0 0 8px rgba(0,229,255,0.6);
  }

  #status{
    text-align:center;
    font-size:11px;
    color:#ff8080;
    margin-top:8px;
    min-height:14px;
  }
</style>
</head>
<body>

<div id="app">
  <div class="stats">
    <div class="stat">
      <div class="label">🍎 Apples</div>
      <div class="value" id="appleCount">0</div>
    </div>
    <div class="stat level">
      <div class="label">Level</div>
      <div class="value" id="levelCount">1</div>
    </div>
  </div>

  <div class="tree-zone">
    <div id="tree">🌳</div>
  </div>

  <div class="upgrade-wrap">
    <button id="upgradeBtn">
      <span class="title">Upgrade Level<small id="upgradeHint">Needs apples</small></span>
      <span class="cost" id="upgradeCost">1 🍎</span>
    </button>
    <div id="status"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
  import {
    getDatabase, ref, get, set, update, increment
  } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDv25RohGhKcxDlt1DZaPb7BUg7LpWnJqo",
    authDomain: "yes-coins-6a2d2.firebaseapp.com",
    databaseURL: "https://yes-coins-6a2d2-default-rtdb.firebaseio.com",
    projectId: "yes-coins-6a2d2",
    storageBucket: "yes-coins-6a2d2.firebasestorage.app",
    messagingSenderId: "868288595143",
    appId: "1:868288595143:web:cc8e500e6c3c8cc4ab2ae2",
    measurementId: "G-9XL5H32P79"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // Assumption: the current username is stored in localStorage under "username"
  // (same pattern as the rest of your pages). If your key is different, change this line only:
  const username = localStorage.getItem("username");

  const appleEl = document.getElementById("appleCount");
  const levelEl = document.getElementById("levelCount");
  const treeEl = document.getElementById("tree");
  const upgradeBtn = document.getElementById("upgradeBtn");
  const upgradeCostEl = document.getElementById("upgradeCost");
  const upgradeHintEl = document.getElementById("upgradeHint");
  const statusEl = document.getElementById("status");

  let state = { level: 1, apple: 0 };
  let gameRef = null;
  let userRootRef = null;
  let saveTimer = null;
  let ready = false;

  // Cost to upgrade from "level" to "level+1"
  // Rule: first cost = 1, each next cost = round(previous cost × 1.5)
  function upgradeCost(level){
    let cost = 1;
    for (let i = 2; i <= level; i++){
      cost = Math.round(cost * 1.5);
    }
    return cost;
  }

  // Coin reward per upgrade, based on the level being upgraded FROM:
  // levels 1-10 -> 1 coin, 11-20 -> 2 coins, 21-30 -> 3 coins, and so on
  function coinReward(level){
    return Math.ceil(level / 10);
  }

  function render(){
    appleEl.textContent = state.apple;
    levelEl.textContent = state.level;
    const cost = upgradeCost(state.level);
    upgradeCostEl.textContent = cost + " 🍎";
    const canUpgrade = state.apple >= cost;
    upgradeBtn.disabled = !canUpgrade;
    upgradeHintEl.textContent = canUpgrade ? "Ready to upgrade" : "Collect more apples";
  }

  function saveGame(){
    if (!gameRef) return;
    set(gameRef, { level: state.level, apple: state.apple })
      .catch(() => { statusEl.textContent = "Save failed, check your connection"; });
  }

  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveGame, 700);
  }

  function spawnFloater(x, y){
    const f = document.createElement("div");
    f.className = "floater";
    f.textContent = "+1 🍎";
    f.style.left = x + "px";
    f.style.top = y + "px";
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 900);
  }

  function spawnCoinFloater(amount){
    const f = document.createElement("div");
    f.className = "coin-floater";
    f.textContent = "+" + amount + " 🪙";
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1100);
  }

  treeEl.addEventListener("click", (e) => {
    if (!ready) return;
    state.apple += 1;
    render();
    scheduleSave();
    const rect = treeEl.getBoundingClientRect();
    const x = (e.clientX || rect.left + rect.width/2) - 14;
    const y = (e.clientY || rect.top + rect.height/2) - 10;
    spawnFloater(x, y);
    treeEl.style.transform = "scale(0.94)";
    setTimeout(() => treeEl.style.transform = "", 90);
  });

  upgradeBtn.addEventListener("click", () => {
    if (!ready) return;
    const cost = upgradeCost(state.level);
    if (state.apple < cost) return;

    const reward = coinReward(state.level);
    state.apple -= cost;
    state.level += 1;
    render();

    clearTimeout(saveTimer);
    saveGame();

    if (userRootRef){
      update(userRootRef, { coins: increment(reward) })
        .catch(() => { statusEl.textContent = "Could not add coins"; });
    }
    spawnCoinFloater(reward);
  });

  async function init(){
    if (!username){
      statusEl.textContent = "No username found on this device";
      upgradeBtn.disabled = true;
      treeEl.style.pointerEvents = "none";
      return;
    }
    gameRef = ref(db, "users/" + username + "/games/apple_tree");
    userRootRef = ref(db, "users/" + username);
    try{
      const snap = await get(gameRef);
      if (snap.exists()){
        const v = snap.val();
        state.level = v.level || 1;
        state.apple = v.apple || 0;
      } else {
        await set(gameRef, { level: 1, apple: 0 });
      }
    }catch(err){
      statusEl.textContent = "Could not load your progress";
    }
    ready = true;
    render();
  }

  init();
</script>
</body>
</html>
