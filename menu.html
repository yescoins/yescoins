<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Menu</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#050707;
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.menu{
  width:100%;
  max-width:390px;
}

.item{
  width:100%;
  min-height:72px;
  margin-bottom:14px;
  padding:10px 14px;
  display:flex;
  align-items:center;
  gap:14px;
  text-decoration:none;
  color:#fff;
  background:#151a1a;
  border:1px solid rgba(0,255,255,.12);
  border-radius:17px;
  transition:.25s;
}

.item:hover{
  transform:translateY(-2px);
  border-color:rgba(0,255,255,.6);
  box-shadow:0 0 18px rgba(0,255,255,.15);
}

.item:active{
  transform:scale(.98);
}

.icon{
  width:48px;
  height:48px;
  flex-shrink:0;
  border-radius:13px;
  border:1px solid rgba(0,255,255,.3);
  background:#080c0c;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.icon img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.text{
  font-size:17px;
  font-weight:bold;
}

.sub{
  color:#777;
  font-size:12px;
  margin-top:4px;
}

.language{
  justify-content:space-between;
  cursor:pointer;
}

.language-left{
  display:flex;
  align-items:center;
  gap:14px;
}

select{
  background:#080c0c;
  color:aqua;
  border:1px solid rgba(0,255,255,.4);
  border-radius:10px;
  padding:9px 10px;
  outline:none;
  font-size:14px;
  cursor:pointer;
}

select:focus{
  box-shadow:0 0 10px rgba(0,255,255,.2);
}

.footer{
  text-align:center;
  color:#555;
  font-size:11px;
  margin-top:20px;
}
  #backBtn {position:fixed; display: inline-block; left: 10px;top: 10px;padding: 8px 15px; background: aqua; color: #111; text-decoration: none; border-radius: 6px; font-weight: bold; }

</style>
</head>

<body>
<a href="home.html" id="backBtn"><i class="fas fa-arrow-left"></i> Back</a>

<div class="menu">

  <!-- Language -->
  <div class="item language">

    <div class="language-left">

      <div class="icon">
        <!-- ضع صورة اللغة هنا لاحقًا -->
        <!-- <img src="language.png"> -->
      </div>

      <div>
        <div class="text">Language</div>
        <div class="sub">Choose your language</div>
      </div>

    </div>

    <select id="language">
      <option value="en">English</option>
      <option value="ar">العربية</option>
    </select>

  </div>


  <!-- FAQ -->
  <a href="faq.html" class="item">

    <div class="icon">
      <!-- ضع صورة FAQ هنا -->
      <!-- <img src="faq.png"> -->
    </div>

    <div>
      <div class="text">FAQ</div>
      <div class="sub">Frequently asked questions</div>
    </div>

  </a>


  <!-- Public Chat -->
  <a href="public_chat.html" class="item">

    <div class="icon">
      <!-- ضع صورة Public Chat هنا -->
      <!-- <img src="chat.png"> -->
    </div>

    <div>
      <div class="text">Public Chat</div>
      <div class="sub">Chat with the community</div>
    </div>

  </a>


  <!-- Privacy Policy -->
  <a href="privacy_policy.html" class="item">

    <div class="icon">
      <!-- ضع صورة Privacy Policy هنا -->
      <!-- <img src="privacy.png"> -->
    </div>

    <div>
      <div class="text">Privacy Policy</div>
      <div class="sub">Read our privacy policy</div>
    </div>

  </a>
<button id="logoutBtn" class="btn" style="background-color:#222;border:0px solid aqua;color:red;padding:12px 110px;border-radius:40px;margin-left:20px;"><b>Logout <i class="fas fa-sign-out-alt"></i></b></button>


  <div class="footer">
    © 2026 Yes Coins
  </div>

</div>


<script>
const language = document.getElementById("language");

language.addEventListener("change",function(){

  if(this.value === "en"){
    window.location.href = "home.html";
  }

  if(this.value === "ar"){
    window.location.href = "home_ar.html";
  }

});
      document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('username');
      location.href = 'index.html';
    });
</script>

</body>
</html>
